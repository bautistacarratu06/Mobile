<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button routerLink="/auth/login" aria-label="Volver al login">
        Volver
      </ion-button>
    </ion-buttons>
    <ion-title>Recuperar contraseña</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <main class="quizly-shell" aria-labelledby="forgot-password-heading">
    <ion-card>
      <ion-card-header>
        <ion-card-title id="forgot-password-heading" role="heading" aria-level="1">
          ¿Olvidaste tu contraseña?
        </ion-card-title>
        <ion-card-subtitle>
          Ingresá tu email. Si existe una cuenta asociada, te enviaremos un código para definir una nueva contraseña.
        </ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <div
          *ngIf="errorMessage"
          class="quizly-banner quizly-banner--error"
          role="alert"
          aria-live="polite"
        >
          <strong>Error:</strong>
          <span>{{ errorMessage }}</span>
        </div>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
          <ion-item>
            <ion-input
              label="Correo electrónico"
              labelPlacement="stacked"
              type="email"
              formControlName="email"
              autocomplete="email"
              required
            ></ion-input>
          </ion-item>

          <div class="forgot-actions">
            <ion-button
              expand="block"
              type="submit"
              [disabled]="isSubmitting"
            >
              {{ isSubmitting ? 'Enviando...' : 'Enviar código de recuperación' }}
            </ion-button>
          </div>
        </form>
      </ion-card-content>
    </ion-card>
  </main>
</ion-content>
