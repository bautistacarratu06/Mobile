<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button routerLink="/auth/login" aria-label="Volver al login">
        Volver
      </ion-button>
    </ion-buttons>
    <ion-title>Nueva contraseña</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <main class="quizly-shell" aria-labelledby="reset-password-heading">
    <ion-card>
      <ion-card-header>
        <ion-card-title id="reset-password-heading" role="heading" aria-level="1">
          Definir nueva contraseña
        </ion-card-title>
        <ion-card-subtitle>
          Si tu cuenta está registrada, ingresá el código recibido y tu nueva contraseña.
        </ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <div
          *ngIf="errorMessage"
          class="quizly-banner quizly-banner--error"
          role="alert"
          aria-live="polite"
        >
          <strong>Error:</strong>
          <span>{{ errorMessage }}</span>
        </div>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
          <ion-item>
            <ion-input
              label="Correo electrónico"
              labelPlacement="stacked"
              type="email"
              formControlName="email"
              autocomplete="email"
              required
            ></ion-input>
          </ion-item>

          <ion-item>
            <ion-input
              label="Código de verificación"
              labelPlacement="stacked"
              type="text"
              inputmode="numeric"
              formControlName="code"
              autocomplete="one-time-code"
              placeholder="123456"
              required
            ></ion-input>
          </ion-item>

          <ion-item>
            <ion-input
              label="Nueva contraseña"
              labelPlacement="stacked"
              type="password"
              formControlName="newPassword"
              autocomplete="new-password"
              required
            ></ion-input>
          </ion-item>

          <ion-item>
            <ion-input
              label="Confirmar nueva contraseña"
              labelPlacement="stacked"
              type="password"
              formControlName="confirmPassword"
              autocomplete="new-password"
              required
            ></ion-input>
          </ion-item>

          <div class="reset-actions">
            <ion-button
              expand="block"
              type="submit"
              [disabled]="isSubmitting"
            >
              {{ isSubmitting ? 'Guardando...' : 'Guardar nueva contraseña' }}
            </ion-button>
          </div>
        </form>
      </ion-card-content>
    </ion-card>
  </main>
</ion-content>
